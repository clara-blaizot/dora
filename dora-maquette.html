<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dora — maquette du frontend</title>
<!--
  MAQUETTE DE RÉFÉRENCE POUR LE FRONTEND DE DORA
  ------------------------------------------------
  Ce fichier est la maquette visuelle et interactive de l'application.
  Ouvre-le dans un navigateur pour la voir. À utiliser comme référence
  pour coder le vrai frontend (React + TypeScript + Vite) :
  - reproduire fidèlement le thème (variables CSS dans :root), l'agencement et les comportements ;
  - le chat est l'élément principal ; les outils (Fiche, Quiz) et les cours (PDF) sont discrets ;
  - le volet "Sources" n'apparaît qu'après une réponse de Dora contenant des sources ;
  - "Fiche" et "Quiz" ne sont pas encore reliés au backend (on affiche une notice) ;
  - les réponses de Dora sont simulées ici : dans l'appli, elles viennent de POST /subjects/{id}/ask
    qui renvoie { answer, sources: [{ n, documentId, filename, page, passage }] }.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF2F7; --sidebar-bg:#FCE1EC; --surface:#FFFFFF; --surface-soft:#FFF7FA;
  --border:#F4C6D7; --border-soft:#FBE3EC;
  --accent:#D6336C; --accent-strong:#A61E4D; --accent-ink:#7A1538;
  --dora-bubble:#FFEDF4; --dora-bubble-border:#FAD6E3; --quote-bg:#FFF3F8;
  --text:#3B1426; --text-muted:#7D4A60;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:15px;line-height:1.5}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,label:focus-within{outline:3px solid #F06595;outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
svg{flex:none}

.app{min-height:100vh;display:flex;flex-wrap:wrap}

/* Sidebar */
.sidebar{flex:1 1 250px;padding:24px 16px;background:var(--sidebar-bg);border-right:1px solid var(--border);display:flex;flex-direction:column;gap:24px}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px}
.brand-mark{width:40px;height:40px;border-radius:12px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px}
.brand-name{font-weight:800;font-size:20px;letter-spacing:-.01em;display:block}
.brand-sub{font-size:13px;color:var(--text-muted)}
.nav{display:flex;flex-direction:column;gap:4px}
.nav-label{padding:0 12px 6px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted)}
.subject{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:10px 12px;border-radius:12px;text-align:left;background:transparent;border:1px solid transparent;font-weight:500}
.subject[aria-current="page"]{background:#fff;border-color:var(--border);font-weight:700;box-shadow:0 1px 3px rgba(59,20,38,.08)}
.subject-dot{width:10px;height:10px;border-radius:50%;flex:none}
.subject-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.add-subject{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin-top:8px;padding:10px 12px;border:1px dashed #E8A3BE;border-radius:12px;background:transparent;color:var(--accent-strong);font-weight:600;text-align:left}

/* Main */
.main{flex:999 1 640px;min-width:0;padding:28px 36px 32px;display:flex;flex-direction:column;gap:18px}
h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em}
.row{display:flex;flex-wrap:wrap;gap:20px;align-items:stretch}

/* Chat */
.chat{flex:999 1 560px;min-width:0;background:var(--surface);border:1px solid var(--border);border-radius:24px;display:flex;flex-direction:column;box-shadow:0 8px 24px rgba(214,51,108,.08)}
.chat-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 20px;border-bottom:1px solid var(--border-soft)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex:none}
.chat-title{flex:1;min-width:160px}
.chat-title h2{margin:0;font-size:18px;font-weight:800}
.chat-title span{font-size:13px;color:var(--text-muted)}
.tools{position:relative;display:flex;gap:6px}
.tool-btn{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border:1px solid var(--border);border-radius:999px;background:#fff;color:var(--accent-ink);font-size:13px;font-weight:600}
.quiz-pop{position:absolute;top:48px;right:0;z-index:5;width:260px;padding:14px;border:1px solid var(--border);border-radius:16px;background:#fff;box-shadow:0 12px 30px rgba(166,30,77,.14);display:flex;flex-direction:column;gap:10px}
.quiz-pop-label{font-size:13px;font-weight:700;color:var(--text-muted)}
.segmented{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px;border-radius:12px;background:#FDE6EF}
.segmented button{min-height:40px;border:none;border-radius:9px;font-size:13px;background:transparent;color:var(--text-muted);font-weight:500}
.segmented button[aria-pressed="true"]{background:#fff;color:var(--accent-ink);font-weight:700;box-shadow:0 1px 3px rgba(59,20,38,.12)}
.btn-primary{min-height:44px;border:none;border-radius:12px;background:var(--accent);color:#fff;font-size:14px;font-weight:700}
.notice{margin:10px 20px 0;padding:8px 12px;border-radius:10px;background:#FFF5F9;border:1px solid var(--border);font-size:13px;color:var(--text-muted)}

.messages{height:520px;overflow-y:auto;padding:22px 24px;display:flex;flex-direction:column;gap:16px}
.empty{margin:auto;max-width:420px;text-align:center;color:var(--text-muted)}
.msg-user{align-self:flex-end;max-width:75%;padding:12px 18px;border-radius:20px 20px 6px 20px;background:var(--accent);color:#fff;white-space:pre-wrap}
.msg-dora{display:flex;gap:10px;align-items:flex-start;max-width:85%}
.msg-dora-avatar{flex:none;width:28px;height:28px;border-radius:50%;background:#FCE4EE;color:var(--accent-strong);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px}
.msg-dora-bubble{display:flex;flex-direction:column;gap:10px;padding:12px 18px;border-radius:6px 20px 20px 20px;background:var(--dora-bubble);border:1px solid var(--dora-bubble-border)}
.msg-dora-bubble .txt{white-space:pre-wrap}
.cites{display:flex;flex-wrap:wrap;gap:6px}
.cite{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:4px 12px;border-radius:999px;font-size:12px;color:var(--accent-ink);background:#fff;border:1px solid var(--border)}
.cite.active{border:1.5px solid var(--accent)}
.thinking{color:var(--text-muted);font-size:14px;font-style:italic;padding-left:38px}

.composer{display:flex;gap:10px;padding:14px 16px 16px;border-top:1px solid var(--border-soft)}
.composer input{flex:1;min-width:0;min-height:52px;padding:0 20px;border:1px solid var(--border);border-radius:16px;background:var(--surface-soft);font-size:16px}
.send{flex:none;width:52px;height:52px;border:none;border-radius:16px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center}
.send:disabled{opacity:.5;cursor:default}

/* Sources */
.sources{flex:1 1 320px;min-width:0;background:var(--surface);border:1px solid var(--border);border-radius:24px;display:flex;flex-direction:column;overflow:hidden}
.sources-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 12px 12px 20px;border-bottom:1px solid var(--border-soft)}
.sources-head h2{margin:0;font-size:17px;font-weight:800;display:inline}
.sources-head .count{font-size:13px;color:var(--text-muted);margin-left:8px}
.icon-btn{width:44px;height:44px;border:none;border-radius:10px;background:transparent;color:var(--text-muted);display:flex;align-items:center;justify-content:center}
.sources ol{list-style:none;margin:0;padding:16px;display:flex;flex-direction:column;gap:12px;height:600px;overflow-y:auto}
.source{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:16px;border:1px solid var(--border);background:#fff}
.source.active{border:1.5px solid var(--accent);box-shadow:0 2px 10px rgba(214,51,108,.12)}
.source-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.source-n{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;border-radius:8px;background:var(--accent);color:#fff;font-size:12px;font-weight:800}
.source-file{font-weight:700;font-size:14px;overflow-wrap:anywhere}
.source-page{font-size:12px;font-weight:600;color:var(--text-muted)}
.source blockquote{margin:0;padding:10px 12px;border-radius:12px;background:var(--quote-bg);font-size:14px;line-height:1.55}

/* Cours */
.courses{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;border-radius:16px;background:rgba(255,255,255,.6);border:1px solid #F8D6E3}
.courses h2{margin:0 6px 0 0;font-size:13px;font-weight:700;color:var(--text-muted)}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 2px 0 12px;border-radius:999px;background:#fff;border:1px solid var(--border);font-size:13px}
.chip-tag{font-size:10px;font-weight:800;color:var(--accent-strong)}
.chip-name{max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip button{width:32px;height:32px;border:none;border-radius:50%;background:transparent;color:var(--accent-strong);display:flex;align-items:center;justify-content:center}
.add-pdf{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:999px;border:1px dashed #E8A3BE;color:var(--accent-strong);font-size:13px;font-weight:600;cursor:pointer}
.muted{font-size:13px;color:var(--text-muted)}

@media (max-width:640px){.main{padding:20px 16px}.messages{height:420px}.sources ol{height:auto;max-height:420px}}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ---------- Icônes (trait) ---------- */
const I = {
  plus:'<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  plusSm:'<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  fiche:'<svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>',
  quiz:'<svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>',
  chevron:'<svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
  send:'<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  close:'<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  closeSm:'<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>'
};
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- Données de démo ---------- */
const cauchy = [
  { n:1, filename:'Chap2_Suites.pdf', page:12, passage:'Définition. Une suite (uₙ) est dite de Cauchy si pour tout ε > 0, il existe N ∈ ℕ tel que pour tous p, q ≥ N, |uₚ − u_q| < ε.' },
  { n:2, filename:'Chap2_Suites.pdf', page:13, passage:'Théorème. Dans ℝ, une suite est convergente si et seulement si elle est de Cauchy. On dit que ℝ est complet.' }
];
const state = {
  activeId:'analyse', draft:'', difficulty:'moyen', quizOpen:false, notice:null, thinking:false,
  subjects:[
    { id:'analyse', name:'Analyse', color:'#D6336C',
      docs:[ {id:'a1',filename:'Chap1_Limites.pdf',meta:'24 pages · 1,2 Mo'}, {id:'a2',filename:'Chap2_Suites.pdf',meta:'31 pages · 1,8 Mo'}, {id:'a3',filename:'TD3_Series.pdf',meta:'6 pages · 340 Ko'} ],
      messages:[
        { id:'m1', role:'user', text:'C’est quoi une suite de Cauchy ?' },
        { id:'m2', role:'dora', text:'Une suite (uₙ) est de Cauchy si ses termes finissent par être aussi proches les uns des autres qu’on le veut : pour tout ε > 0, il existe un rang N à partir duquel deux termes quelconques sont à distance inférieure à ε.\n\nDans ℝ, c’est équivalent à être convergente, grâce à la complétude de ℝ.', sources:cauchy }
      ],
      panel:{ open:true, messageId:'m2', activeN:1 } },
    { id:'quantique', name:'Physique quantique', color:'#F783AC',
      docs:[ {id:'q1',filename:'Cours_Postulats.pdf',meta:'18 pages · 960 Ko'}, {id:'q2',filename:'Oscillateur_harmonique.pdf',meta:'12 pages · 610 Ko'} ],
      messages:[], panel:{ open:false } },
    { id:'algo', name:'Algorithmique', color:'#A61E4D',
      docs:[ {id:'g1',filename:'Graphes_BFS_DFS.pdf',meta:'22 pages · 1,1 Mo'} ], messages:[], panel:{ open:false } },
    { id:'eco', name:'Économie', color:'#E599B8', docs:[], messages:[], panel:{ open:false } }
  ]
};
const LEVELS = [ {id:'facile',label:'Facile'}, {id:'moyen',label:'Moyen'}, {id:'difficile',label:'Difficile'} ];
const active = () => state.subjects.find((s) => s.id === state.activeId);

/* ---------- Rendu ---------- */
function render() {
  const s = active();
  const panelMsg = s.panel.open ? s.messages.find((m) => m.id === s.panel.messageId) : null;
  const sources = panelMsg ? panelMsg.sources || [] : [];
  const n = s.docs.length;

  document.getElementById('app').innerHTML = `
  <div class="app">
    <aside class="sidebar" aria-label="Matières">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">D</div>
        <div><span class="brand-name">Dora</span><span class="brand-sub">Ton assistante de révision</span></div>
      </div>
      <nav class="nav" aria-label="Liste des matières">
        <span class="nav-label">Mes matières</span>
        ${state.subjects.map((x) => `
          <button type="button" class="subject" data-action="select" data-id="${x.id}" ${x.id === s.id ? 'aria-current="page"' : ''}>
            <span class="subject-dot" aria-hidden="true" style="background:${x.color}"></span>
            <span class="subject-name">${esc(x.name)}</span>
          </button>`).join('')}
        <button type="button" class="add-subject" data-action="add-subject">${I.plus} Nouvelle matière</button>
      </nav>
    </aside>

    <main class="main">
      <header><h1>${esc(s.name)}</h1></header>

      <div class="row">
        <section class="chat" aria-labelledby="chat-title">
          <div class="chat-head">
            <div class="avatar" aria-hidden="true">D</div>
            <div class="chat-title">
              <h2 id="chat-title">Demande à Dora</h2>
              <span>${n === 0 ? 'Aucun cours ajouté' : 'Répond à partir de ' + n + ' cours'}</span>
            </div>
            <div class="tools">
              <button type="button" class="tool-btn" data-action="fiche">${I.fiche} Fiche</button>
              <button type="button" class="tool-btn" data-action="toggle-quiz" aria-expanded="${state.quizOpen}" aria-controls="quiz-pop">${I.quiz} Quiz ${I.chevron}</button>
              ${state.quizOpen ? `
              <div class="quiz-pop" id="quiz-pop">
                <span class="quiz-pop-label" id="diff-label">Difficulté</span>
                <div class="segmented" role="group" aria-labelledby="diff-label">
                  ${LEVELS.map((l) => `<button type="button" data-action="level" data-id="${l.id}" aria-pressed="${state.difficulty === l.id}">${l.label}</button>`).join('')}
                </div>
                <button type="button" class="btn-primary" data-action="quiz">Générer le quiz</button>
              </div>` : ''}
            </div>
          </div>

          ${state.notice ? `<p class="notice" role="status">${esc(state.notice)}</p>` : ''}

          <div class="messages" id="messages" aria-live="polite">
            ${s.messages.length === 0 ? `<div class="empty">Pose une question sur tes cours de ${esc(s.name)}. Dora te répond et t'indique les passages des PDF qu'elle a utilisés.</div>` : ''}
            ${s.messages.map((m) => m.role === 'user'
              ? `<div class="msg-user">${esc(m.text)}</div>`
              : `<div class="msg-dora">
                  <div class="msg-dora-avatar" aria-hidden="true">D</div>
                  <div class="msg-dora-bubble">
                    <span class="txt">${esc(m.text)}</span>
                    ${(m.sources || []).length ? `<div class="cites">${m.sources.map((c) => {
                      const on = s.panel.open && s.panel.messageId === m.id && s.panel.activeN === c.n;
                      return `<button type="button" class="cite${on ? ' active' : ''}" data-action="cite" data-msg="${m.id}" data-n="${c.n}"><strong>[${c.n}]</strong> ${esc(c.filename)} · p. ${c.page}</button>`;
                    }).join('')}</div>` : ''}
                  </div>
                </div>`).join('')}
            ${state.thinking ? '<div class="thinking">Dora réfléchit…</div>' : ''}
          </div>

          <div class="composer">
            <label for="question" class="sr-only">Ta question</label>
            <input id="question" type="text" placeholder="Pose ta question à Dora…" value="${esc(state.draft)}" autocomplete="off">
            <button type="button" class="send" data-action="send" aria-label="Envoyer la question" ${state.thinking ? 'disabled' : ''}>${I.send}</button>
          </div>
        </section>

        ${sources.length ? `
        <aside class="sources" aria-labelledby="sources-title">
          <div class="sources-head">
            <div><h2 id="sources-title">Sources</h2><span class="count">${sources.length} passage${sources.length > 1 ? 's' : ''}</span></div>
            <button type="button" class="icon-btn" data-action="close-sources" aria-label="Fermer le volet Sources">${I.close}</button>
          </div>
          <ol>
            ${sources.map((src) => `
              <li class="source${s.panel.activeN === src.n ? ' active' : ''}" id="source-${src.n}">
                <div class="source-meta">
                  <span class="source-n">${src.n}</span>
                  <span class="source-file">${esc(src.filename)}</span>
                  <span class="source-page">p. ${src.page}</span>
                </div>
                <blockquote>${esc(src.passage)}</blockquote>
              </li>`).join('')}
          </ol>
        </aside>` : ''}
      </div>

      <section class="courses" aria-labelledby="pdf-title">
        <h2 id="pdf-title">Mes cours</h2>
        ${s.docs.map((d) => `
          <span class="chip">
            <span class="chip-tag">PDF</span>
            <span class="chip-name" title="${esc(d.meta)}">${esc(d.filename)}</span>
            <button type="button" data-action="remove-doc" data-id="${d.id}" aria-label="Supprimer ${esc(d.filename)}">${I.closeSm}</button>
          </span>`).join('')}
        ${n === 0 ? '<span class="muted">Aucun PDF pour l\'instant.</span>' : ''}
        <label class="add-pdf">${I.plusSm} Ajouter
          <input class="sr-only" id="file-input" type="file" accept="application/pdf,.pdf" multiple>
        </label>
      </section>
    </main>
  </div>`;

  const box = document.getElementById('messages');
  box.scrollTop = box.scrollHeight;
  const activeSrc = document.getElementById('source-' + s.panel.activeN);
  if (activeSrc) activeSrc.scrollIntoView({ block:'nearest' });
}

/* ---------- Actions ---------- */
function send() {
  const q = state.draft.trim();
  if (!q || state.thinking) return;
  const s = active();
  s.messages.push({ id:'u' + Date.now(), role:'user', text:q });
  state.draft = ''; state.thinking = true;
  render();
  // Simulation de POST /subjects/{id}/ask
  setTimeout(() => {
    const id = 'd' + Date.now();
    if (!s.docs.length) {
      s.messages.push({ id, role:'dora', text:'Je n’ai encore aucun cours pour cette matière. Ajoute un PDF dans « Mes cours », puis repose ta question.', sources:[] });
    } else {
      const sources = s.docs.slice(0, 2).map((d, i) => ({ n:i + 1, filename:d.filename, page:3 + i * 4, passage:'[Passage renvoyé par le RAG pour « ' + q + ' »]' }));
      s.messages.push({ id, role:'dora', text:'(Réponse simulée) Voici ce que j’ai trouvé dans tes cours pour répondre à ta question. Le backend RAG remplacera ce texte.', sources });
      s.panel = { open:true, messageId:id, activeN:1 };
    }
    state.thinking = false;
    render();
    document.getElementById('question').focus();
  }, 800);
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) {
    if (state.quizOpen && !e.target.closest('.quiz-pop')) { state.quizOpen = false; render(); }
    return;
  }
  const s = active();
  switch (el.dataset.action) {
    case 'select': state.activeId = el.dataset.id; state.draft = ''; state.quizOpen = false; state.notice = null; break;
    case 'add-subject': {
      const id = 's' + Date.now();
      state.subjects.push({ id, name:'Nouvelle matière ' + (state.subjects.length + 1), color:'#F06595', docs:[], messages:[], panel:{ open:false } });
      state.activeId = id; state.draft = ''; state.quizOpen = false; state.notice = null; break;
    }
    case 'fiche': state.quizOpen = false; state.notice = 'Fiche de révision « ' + s.name + ' » : pas encore reliée au backend.'; break;
    case 'toggle-quiz': state.quizOpen = !state.quizOpen; break;
    case 'level': state.difficulty = el.dataset.id; break;
    case 'quiz': {
      const label = LEVELS.find((l) => l.id === state.difficulty).label;
      state.quizOpen = false; state.notice = 'Quiz « ' + s.name + ' » (niveau ' + label + ') : pas encore relié au backend.'; break;
    }
    case 'cite': s.panel = { open:true, messageId:el.dataset.msg, activeN:Number(el.dataset.n) }; break;
    case 'close-sources': s.panel = Object.assign({}, s.panel, { open:false }); break;
    case 'remove-doc': s.docs = s.docs.filter((d) => d.id !== el.dataset.id); break;
    case 'send': send(); return;
    default: return;
  }
  render();
});

document.addEventListener('input', (e) => { if (e.target.id === 'question') state.draft = e.target.value; });
document.addEventListener('keydown', (e) => {
  if (e.target.id === 'question' && e.key === 'Enter') { e.preventDefault(); send(); }
  if (e.key === 'Escape' && state.quizOpen) { state.quizOpen = false; render(); }
});
document.addEventListener('change', (e) => {
  if (e.target.id !== 'file-input') return;
  const files = Array.from(e.target.files || []).filter((f) => /\.pdf$/i.test(f.name));
  const s = active();
  files.forEach((f, i) => s.docs.push({
    id:'p' + Date.now() + i, filename:f.name,
    meta: f.size >= 1048576 ? (f.size / 1048576).toFixed(1).replace('.', ',') + ' Mo' : Math.max(1, Math.round(f.size / 1024)) + ' Ko'
  }));
  render();
});

render();
</script>
</body>
</html>
